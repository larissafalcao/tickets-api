spring:
  application:
    name: tickets-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tickets}
    username: ${DB_USERNAME:tickets}
    password: ${DB_PASSWORD:tickets}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: ${SERVER_PORT:8080}
